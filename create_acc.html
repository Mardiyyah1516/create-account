<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="create_acc.css">
</head>
<body>
    <div class="form_card">
        <h2 class="header">Create Account</h2>
        <div>
            <label for="fname">Your name</label>
            <div class="name_input">
                <input type="text" id="fname" placeholder="First name">
                <input type="text" class="lname" id="lname" placeholder="Last name">
            </div>
        </div>
        <div class="email_input">
            <label for="email">Email Address</label>
            <div class="email">
              <input type="email" id="email" placeholder="email" />
            </div>
        </div>
        <div class="username_input">
            <label for="username">Username</label>
            <div class="username">
                <input type="text" id="username" placeholder="username">
            </div>
        </div>
        <div class="flex_input">
            <div class="gender_input">
            <label for="gender">Gender</label>
            <div class="row">
                <select class="gender">Gender
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
            
            <div class="birthday_col">
                <label for="fname">Birthday</label>
                    <div class="birthday_input">
                        <input type="number" id="dayinput" min="1" max="31" steps="1" placeholder="Day" />
                        <input type="number" id="monthinput" min="1" max="12" step="1" placeholder="Month" />
                        <input type="number" id="yearinput" min="1900" max="2500" step="1" placeholder="Year" />
                    </div>
            </div>
            </div>
            <div class="password">
                <label for="password">Password</label>
                <div class="password_input">
                    <input type="password" id="password">
                </div>
            </div>
            <div class="terms_button">
                <input type="checkbox" id="terms">
                <label for="terms">Agree with Terms & Conditions</label>
            </div>
            <div class="button-div">
                <button class="button" type="submit">Create Account</button>
            </div>
            <div>
                <p class="login_text">Already have an account? 
                    <a href="loginpage.html">Login to Account</a>
                </p>
            </div>
        </div>
    </div>
        
</body>
</html>
